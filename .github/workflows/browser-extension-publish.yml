name: Browser Extension Build & Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      publish_chrome:
        description: 'Publish to Chrome Web Store'
        required: false
        type: boolean
        default: false
      publish_edge:
        description: 'Publish to Edge Add-ons'
        required: false
        type: boolean
        default: false

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Browser unit tests
        working-directory: ./browser
        run: npm run test:unit

      - name: Install Playwright Chromium
        working-directory: ./browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        working-directory: ./browser
        run: npm run test:e2e
        env:
          CI: true
        timeout-minutes: 10

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: browser/playwright-report/

  build:
    name: Build Extensions
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Get version
        id: version
        working-directory: ./browser
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Extension version: ${VERSION}"

      - name: Update manifest version
        working-directory: ./browser
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          jq ".version = \"${VERSION}\"" chrome/manifest.json > chrome/manifest.tmp && mv chrome/manifest.tmp chrome/manifest.json

      - name: Build production extension
        working-directory: ./browser
        run: npm run build:production

      - name: Upload Chrome extension
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension
          path: browser/builds/v${{ steps.version.outputs.version }}/chrome-extension.zip

      - name: Upload Edge extension
        uses: actions/upload-artifact@v4
        with:
          name: edge-extension
          path: browser/builds/v${{ steps.version.outputs.version }}/edge-extension.zip

  publish-chrome:
    name: Publish to Chrome Web Store
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.publish_chrome == 'true'
    steps:
      - name: Download Chrome extension
        uses: actions/download-artifact@v4
        with:
          name: chrome-extension

      - name: Publish to Chrome Web Store
        uses: mobilefirstllc/cws-publish@v1
        with:
          refresh_token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          client_id: ${{ secrets.CHROME_CLIENT_ID }}
          client_secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          extension_id: ${{ secrets.CHROME_EXTENSION_ID }}
          zip_file: chrome-extension.zip

  publish-edge:
    name: Publish to Edge Add-ons
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.publish_edge == 'true'
    steps:
      - name: Download Edge extension
        uses: actions/download-artifact@v4
        with:
          name: edge-extension

      - name: Publish to Edge Add-ons
        uses: wdzeng/edge-addon@v1
        with:
          client-id: ${{ secrets.EDGE_CLIENT_ID }}
          client-secret: ${{ secrets.EDGE_CLIENT_SECRET }}
          product-id: ${{ secrets.EDGE_PRODUCT_ID }}
          access-token-url: ${{ secrets.EDGE_ACCESS_TOKEN_URL }}
          zip-path: edge-extension.zip

  create-release:
    name: Create GitHub Release
    needs: [build, publish-chrome, publish-edge]
    runs-on: ubuntu-latest
    if: always() && needs.build.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%an)" --no-merges)
          else
            COMMITS=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%an)" --no-merges)
          fi
          cat > CHANGELOG.md << EOF
          ## What's Changed

          ${COMMITS}

          ## Extension Downloads

          - **Chrome Web Store**: [Install](https://chrome.google.com/webstore/detail/${{ secrets.CHROME_EXTENSION_ID }})
          - **Edge Add-ons**: [Install](https://microsoftedge.microsoft.com/addons/detail/${{ secrets.EDGE_PRODUCT_ID }})

          Or download the extension packages directly from the assets below.
          EOF
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          cat CHANGELOG.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Bergamot Browser Extension v${{ needs.build.outputs.version }}
          body: ${{ steps.changelog.outputs.changelog }}
          files: |
            artifacts/chrome-extension/chrome-extension.zip
            artifacts/edge-extension/edge-extension.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
